name: Daily Meditation Agent

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
  workflow_dispatch:

jobs:
  meditate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and deliver meditation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python -m src.main

      - name: Commit generated script
        if: success()
        run: |
          git config user.name "daily-meditation-agent"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/
          git diff --cached --quiet || git commit -m "Add meditation script for $(date -u +%F)"
          git push
